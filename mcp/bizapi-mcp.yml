tools:
  - name: search_companies
    description: >-
      Match a business record against the D&B business database and return firmographic data —
      NAICS and SIC codes, address, contact, size figures and corporate hierarchy. Consumes one
      prepaid match credit on a successful match.
    source_operation: openapi/bizapi-company-search-api-openapi.yml#searchCompanies
    method: POST
    path: /cosearch
    consequence: billable
    note: >-
      Input is one of six mutually-shaped match keys — see
      conventions/bizapi-conventions.yml#matching_semantics. An agent must send duns, url or
      phone ALONE or those match methods will not trigger.
  - name: search_companies_test
    description: >-
      Identical contract to search_companies against the sandbox endpoint. Returns fabricated
      append data and consumes no credits. Include the string "bad" in any input field to force
      a no-match response.
    source_operation: openapi/bizapi-company-search-api-openapi.yml#searchCompaniesTest
    method: POST
    path: /cosearchtest
    consequence: safe
    note: The correct default for any agent exploring this API. See sandbox/bizapi-sandbox.yml.
agent_notes:
  - >-
    A no-match is HTTP 200 with Appended Data.Message = "No match found". An agent that keys
    off status codes will report a phantom success.
  - >-
    There is no idempotency key. Every retry of a successful match is separately billable
    against the account's prepaid credit balance.
  - >-
    Throughput is capped at 3 requests per rolling second with no Retry-After header, so an
    agent must pace itself blind.
  - >-
    The remaining credit balance is only readable from Matching Data."Matches Remaining" on a
    200 response; there is no quota endpoint.
