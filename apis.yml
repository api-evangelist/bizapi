apis:
- aid: bizapi:bizapi-company-search-api
  name: BizAPI Company Search API
  description: >-
    Real-time business data append API. Submit a partial business record — company name and
    address, phone, website or DUNS number — and BizAPI matches it against the Dun & Bradstreet
    business database, returning NAICS and SIC classification codes, address and contact data,
    employee and sales figures, and the corporate family tree. One POST operation plus a
    credit-free sandbox twin, HTTP Basic auth, billed per successful match.
