  - id: sic
    conforms: true
    evidence: Returns 4-digit and 8-digit SIC codes with descriptions.
  - id: duns
    conforms: true
    evidence: >-
      Returns D&B D-U-N-S nine-digit identifiers and the full corporate linkage tree (global
      ultimate, domestic ultimate, parent/HQ, hierarchy code, family member count) sourced from
      the D&B business database.
data_provenance:
  upstream: Dun & Bradstreet business database
  quote: >-
    "they are Matched against the D&B Business Database; the Largest and Best Quality Business
    Database in the Market."
  note: >-
    BizAPI is a redistribution surface over D&B data. The BEMFAB field carries D&B suppression
    semantics — a value of D means the record was de-listed at the customer's request and may
    not be marketed to, only industry-coded. Downstream consumers inherit that restriction.
privacy:
  pii_posture: >-
    The provider explicitly instructs callers to exclude Personally Identifiable Information
    from the optional passthrough fields on the request. Firmographic responses do include
    named CEO/top-contact fields on the Telemarketing and richer layouts.
  privacy_policy: https://www.naics.com/privacypolicy/
  cookie_policy: https://www.naics.com/cookie-policy/
  terms_of_service: null
  terms_note: >-
    No terms of service, terms of use or API license agreement page was found. /terms/,
    /terms-of-use/, /terms-and-conditions/ and /terms-conditions/ all return 404; /legal/ is a
    marketing page for a Legal Status Append product, not a legal agreement.
