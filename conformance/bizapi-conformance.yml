searched:
  note: >-
    The provider publishes no compliance program, certification list, trust center or standards
    conformance claim. https://www.naics.com/security/ and /responsible-disclosure/ return 404;
    probe-security-programs.py found no vulnerability-disclosure policy and no trust center.
    The only third-party assurance mark found anywhere on the site is an Authorize.Net Verified
    Merchant badge on the BizAPI details page, which speaks to payment processing on the web
    store, not to the API. No Compliance pointer is emitted in apis.yml.
  date: '2026-08-14'
standards:
  - id: rest
    conforms: true
    evidence: >-
      Provider states "The API is organized around REST" (BizAPI V2 Documentation, section 1.0).
      Partial in practice — reads are modelled as POST and there is no resource addressing.
  - id: http-basic-auth
    conforms: true
    evidence: >-
      RFC 7617. OpenAPI securityScheme type http / scheme basic; provider documents
      "Authorization: Basic " with base64-encoded credentials.
  - id: tls-required
    conforms: true
    evidence: >-
      "All requests should be made over SSL." Probed TLSv1.3 with HSTS max-age 31536000 on
      www.naics.com (security/bizapi-domain-security.yml).
  - id: oauth2
    conforms: false
    evidence: No oauth2 securityScheme in any spec and no OAuth documentation.
  - id: oidc
    conforms: false
    evidence: /.well-known/openid-configuration returns 404.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors are bespoke JSON with literal message strings; no application/problem+json media
      type appears in the spec or the docs. See errors/bizapi-problem-types.yml.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: >-
      No Sunset or Deprecation header support documented, and no deprecation policy, despite
      the provider recommending migration off V1.
  - id: rfc9116-security-txt
    conforms: false
    evidence: /.well-known/security.txt returns 404 (well-known/bizapi-well-known.yml).
  - id: rfc8615-well-known
    conforms: false
    evidence: Every probed /.well-known/ path returns 404.
  - id: idempotency-key
    conforms: false
    evidence: >-
      No idempotency header or dedupe window documented, on an API where every successful call
      is billable. See conventions/bizapi-conventions.yml#idempotency.
  - id: pagination
    conforms: not-applicable
    evidence: Single-record append API; no collection endpoints exist to page.
  - id: rate-limit-headers
    conforms: false
    evidence: >-
      429 is returned with a message but no RateLimit-*, X-RateLimit-* or Retry-After header is
      documented or observed.
  - id: openapi
    conforms: partial
    evidence: >-
      No OpenAPI is published by the provider. The spec in this repo was authored by API
