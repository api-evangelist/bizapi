      see lifecycle/bizapi-lifecycle.yml#notes.
  - id: asyncapi
    conforms: not-applicable
    evidence: No event, streaming or webhook surface exists. Not penalized.
  - id: json-api
    conforms: false
    evidence: Bespoke three-block response envelope, not JSON:API media type or structure.
  - id: naics-2022
    conforms: true
    evidence: >-
      Domain standard. Returns 6-digit NAICS codes with descriptions; NAICS Association is the
