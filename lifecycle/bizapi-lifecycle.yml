  - >-
    DEFECT IN THIS REPO'S SPEC, recorded 2026-08-14. Both provider PDFs — BizAPI
    Documentation v3.0.1.1 (2020-08-12, covering /naicsapi/v1) and BizAPI V2 Documentation
    v2.0.0.1 (2021-09-01, covering /naicsapi/v2) — publish the request body as companyName,
    address, city, state, postalCode, country, phone, duns, url, and the response as a
    three-block envelope of "Search Terms" / "Matching Data" / "Appended Data".
    openapi/bizapi-company-search-api-openapi.yml in this repo instead declares company_name,
    street, zip and a flat response of duns_number/company_name/sic_code_4/... Those names
    appear in no provider document and do not match the provider-published Postman collection
    either. The spec predates this enrichment pass and was not harvested from the provider.
    It is left unmutated per pipeline rule; the corrections are captured as an OpenAPI Overlay
    at overlays/bizapi-company-search-api-overlay.yaml and should be folded into a re-harvested
    spec before the next scoring run.
  - >-
    The document version numbers are documentation versions, not API versions: the V1 manual
    is labelled 3.0.1.1 and the V2 manual 2.0.0.1. Do not read them as a version sequence.
